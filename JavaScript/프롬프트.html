<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<script>
let ret = prompt("이름을 입력하세요", "김도훈");

if(ret==null){
    alert("취소되었습니다.");
}
else if(ret==""){
    alert("이름을 입력해주세요.");
}
else{
    alert(ret+"님 환영합니다.");
}
</script>
</head>
