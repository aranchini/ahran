    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<script>
let ret = confirm("전송할까요?");

if(ret==false){
    alert("취소되었습니다.");
}
else if(ret==null){
    alert("입력값이 없습니다.");
}
else{ret==true
    alert("전송되었습니다.");
} // 컨펌은 트루 와 펄스만 반환하기 때문에 null은 안써도 됩니다. 
</script>
</head>
