<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1407 서아란</title>
    <style>
        h3 {
            text-align: center;
            background-color: skyblue;
            color: rgb(218, 255, 6);
        }


        hr {
            border: 5px solid rgb(154, 244, 132);
        }
        img{width:300px;
        height: 150px;}
        .left{
            box-shadow: 5px 5px black;
        }
        .mid{
            box-shadow: 5px 5px skyblue;
        }
        .right{
            box-shadow: 5px 5px yellowgreen;
        }
        #cat{
            cursor: progress;
        }
    </style>

</head>

<body>
    <header>
        <h3>GSM 사진첩</h3>
        <hr>
    </header>
    <section>
        <article>
            <table>
                <tr>
                    <td class="left">

                    </td>
                    <td class="mid">
                        <img src="GSM로고.png">
                    </td>
                    <td class="right"></td>
                </tr>
                <tr>
                    <td class="left">
                        <img src="게임.png">
                    </td>
                    <td class="mid">
                        <img src="https://www.placecats.com/600/300"
                        id="cat">
                    </td>
                    <td class="right">
                        <img src="생명.png">
                    </td>
                </tr>
            </table>
        </article>
    </section>
</body>

</html>
