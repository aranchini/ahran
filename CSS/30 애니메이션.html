<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    @keyframes TCA{
        0%{color:blue;}
        20%{color:red;}
        40%{color:green;}
        60%{color:orange;}
        80%{color:purple;}
        100%{color:yellow;}
        /* 뚝 끊기게 하고 싶지 않으면 마지막 100%는 0%와 같은 색으로 해준다. */
    }
    span{
        animation-name:TCA;
        animation-duration: 10s;
        animation-iteration-count: infinite;
    }
</style>
</head>
<body>
<p style="font-size: 150px;"><span>span</span>이라는 텍스트의 색변화를 무한반복합니다</p>
</body>
</html>
