<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    #menu{
        background-color: olive;
    }
    #menu ul{
        margin: 0;
        padding: 0;
        width: 567px;
    }
    #menu ul li{
        display: inline-block;
        list-style-type: none;
        padding: 0px 15px;
    }
    #menu ul li a{
        text-decoration: none;
        color: white;
    }
    #menu ul li a:hover{
        color: violet;
    }
</style>
</head>
<body>
    <div id="menu">
        <ul>
            <li><a href="#">홈</a></li>
            <li><a href="#">소개</a></li>
            <li><a href="#">서비스</a></li>
            <li><a href="#">고객센터</a></li>
        </ul>
</body>
</html>
