<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
div{position:absolute;}
img{position: absolute;}
#cat1{z-index:1;left:60px;top:40px;}
#cat2{z-index:2;left:80px;top:120px;}
#cat3{z-index:3;left:120px;top:160px;}
#cat4{z-index:4;left:180px;top:200px;}
/* z-index는 요소의 쌓이는 순서를 결정하는 속성입니다. z-index 값이 높을수록 요소가 위에 쌓이게 됩니다. */
</style>
</head>
<body>
<div>
    <img id="cat1" src="https://www.placecats.com/240/320" alt="고양이1">
    <img id="cat2" src="https://www.placecats.com/200/300" alt="고양이2">
    <img id="cat3" src="https://www.placecats.com/300/200" alt="고양이3">
    <img id="cat4" src="https://www.placecats.com/320/200" alt="고양이4">
</div>
</body>
</html>
