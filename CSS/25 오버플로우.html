<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
p{font-size: 25px;
    width: 240px;
    height: 100px;
    border: 6px solid black;
}
</style>
</head>
<body>
<p style="overflow: hidden;">오버플로우에 hidden 값을 적용하면 박스를 넘어가는 내용이 잘려 나갑니다....</p>
<br><br><br><br>
<p style="overflow: visible;">오버플로우에 visible 값을 적용하면 박스를 넘어가는 내용이 보입니다.</p>
<br><br><br><br>
<p style="overflow: scroll;">오버플로우에 scroll 값을 적용하면 박스를 넘어가는 내용이 스크롤을 통해 보입니다.</p>
<br><br><br><br>
</body>
</html>
