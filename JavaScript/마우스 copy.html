<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function over(obj){
            obj.src='applefull.png';
        }
        function out(obj){
            obj.src='apple.png';
        }
    </script>
</head>
<body>
<h3>마우스를 올리면</h3>
<img src="apple.png"
onmouseover="over(this);"
onmouseout="out(this);">
</body>
</html>
