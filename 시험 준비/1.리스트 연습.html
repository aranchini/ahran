<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ol>
        <li>안녕하세요</li>
        <li>모레가 시험인데</li>
        <li>공부를 안하고있습니다</li>
        <li>그래서 오늘은 공부를 해야합니다</li>
    </ol>
    <ul>
        <li>이번엔 순서없는 리스트를</li>
        <li>만들어보겠습니다</li>
        <li>순서없는 리스트는 ul 태그를 사용합니다</li>
    </ul>
    <dl>
        <dt>마지막으로 dl입니다</dt>
        <dd>dl은 정의 목록을 만드는 태그입니다</dd>
        <dt>dl은 무엇인가요?</dt>
        <dd>dl은 definition list의 약자로, 용어와 그에 대한 정의를 나타내는 데 사용됩니다</dd>
    </dl>
