<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    @keyframes BIG{
        0%{font-size: 500%;}
        50%{font-size: 50%;}
        100%{font-size: 500%;}
    }
    span{
        animation-name:BIG;
        animation-duration: 3s;
        animation-iteration-count: infinite;
    }
</style>
</head>
<body>
    <p><span>BIG</span><br>이라는 텍스트의 크기가 커졌다 작아집니다</p>
</body>
</html>
