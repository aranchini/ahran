<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
.parent{
    posiqtion: relative;
    border:3px solid navy;
    padding: 10px;
    width: 300px;
    height: 250px;
    background-color: pink;
}

.box{
    width: 100px;
    height: 60px;
    color: white;
    text-align: center;
    line-height: 60px;
    font-weight: bold;
}

.box1{background-color: blue;}
.box2{background-color: red;}
.box3{background-color: green;}
</style>
</head>
<body>
<div class="container">
    <h2>position: relative test;</h2>
    <div class="parent">
        <div class="box box1">1번(static)</div>
        <div class="box box2 relative">2번(타겟)</div>
        <div class="box box3">3번(static)</div>
    </div>
</div>
</body>
</html>
